# Avast's Web Shield intercepts HTTPS on this machine and re-signs it with a
# locally generated CA. Windows, curl and Node all trust that CA, but the JVM
# ships its own truststore, so Gradle's downloads fail PKIX validation. The
# truststore below is a copy of the JDK's cacerts with the Avast root added;
# regenerate it with gradle/setup-truststore.ps1 if the AV reinstalls.
# Delete both -Djavax.net.ssl.* flags on a machine without TLS interception.
# 2 GB is comfortable for a project this size. A larger heap was tried first and
# the daemon was killed by a native allocation failure on this machine, so keep
# the ceiling low enough to leave the OS room.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8 -Djavax.net.ssl.trustStore=C:/Users/Dell/.gradle/avast-jdk-truststore.jks -Djavax.net.ssl.trustStorePassword=changeit
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

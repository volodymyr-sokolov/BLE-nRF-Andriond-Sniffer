; BLE advertising sniffer for the Adafruit Feather nRF52840 Express.
;
; The sketch never calls Bluefruit.begin(), so the SoftDevice stays dormant and
; the RADIO peripheral is driven directly. Packets leave over the nRF52840's
; native USB CDC port, which is what the Android app opens in USB host mode.

[env]
platform = nordicnrf52
board = adafruit_feather_nrf52840
framework = arduino

upload_protocol = nrfutil
monitor_speed = 115200
monitor_echo = yes
monitor_eol = LF

build_flags =
    -DCFG_DEBUG=0
    -Wall

; The sniffer. Keep this environment name: the Android build looks for its
; firmware.zip by path to bundle it into the APK.
[env:adafruit_feather_nrf52840]
build_src_filter = +<*> -<beacon/>

; The reference beacon of specification §6, for a *second* board. It transmits a
; payload the receiver already knows, so recovery can be measured against ground
; truth rather than against damage this project injected itself.
;
; Two environments rather than two projects because the two boards are the same
; board with the same toolchain, and a second copy of the build configuration is
; a second place for it to drift.
[env:beacon]
build_src_filter = +<beacon/> -<beacon/airtime.cpp>

; The same beacon with the air-time option of `ble-advertising-queueing-theory.md`
; compiled in: it senses each advertising channel, estimates lambda_k and E[S_k],
; and chooses T_a, the channel map and the start phase from them.
;
; A separate environment rather than a runtime switch on one binary, because the
; two arms of the experiment are meant to differ by the whole transmitter. With
; a switch, "adaptation was off" is a claim about a command somebody typed; with
; two binaries it is a claim about which file was flashed, which is checkable
; afterwards from the banner the board prints.
;
; airtime.cpp is excluded from [env:beacon] above, so the plain firmware does not
; merely leave the option turned off - it does not contain it.
[env:beacon_adaptive]
build_src_filter = +<beacon/>
build_flags =
    ${env.build_flags}
    -DBEACON_ADAPTIVE=1
